<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 505" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <linearGradient id="docg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <path id="loopPath" d="M 253 155 L 632 155 C 700 155 732 190 732 243 C 732 330 560 368 420 368 C 280 368 175 340 152 282" fill="none"/>
    <style>
      .t  { fill: #1f2937; font-size: 15px; font-weight: 600; }
      .ts { fill: #6b7280; font-size: 12px; }
      .flow  { stroke: #8b5cf6; stroke-width: 2.5; fill: none; marker-end: url(#arrV); stroke-dasharray: 6 5; animation: dash 1.1s linear infinite; }
      .flowB { stroke: #3b82f6; stroke-width: 2;   fill: none; marker-end: url(#arrB); stroke-dasharray: 4 5; animation: dash 1.4s linear infinite; opacity: .75; }
      @keyframes dash { to { stroke-dashoffset: -11; } }

      /* identity lines drift once per orbit (30s = 5 orbits of 6s) */
      .l1 { animation: drift1 30s ease-in-out infinite; }
      .l2 { animation: drift2 30s ease-in-out infinite; transform-origin: 80px 203px; }
      .l3 { animation: drift3 30s ease-in-out infinite; transform-origin: 80px 224px; }
      @keyframes drift1 { 0%,8% { stroke: #c4b5fd; } 25%,100% { stroke: #7c3aed; } }
      @keyframes drift2 { 0%,25% { stroke: #c4b5fd; transform: scaleX(1); } 45%,100% { stroke: #f59e0b; transform: scaleX(1.28); } }
      @keyframes drift3 { 0%,45% { stroke: #c4b5fd; transform: scaleX(1); } 65% { stroke: #10b981; transform: scaleX(0.72); } 85%,100% { stroke: #10b981; transform: scaleX(1.15); } }

      /* k-label ticker: one increment per orbit */
      .k0,.k1,.k2,.k3,.k4 { opacity: 0; animation: tick 30s linear infinite; fill: #7c3aed; font-size: 15px; font-weight: 700; }
      .k1 { animation-delay: 6s; } .k2 { animation-delay: 12s; }
      .k3 { animation-delay: 18s; } .k4 { animation-delay: 24s; }
      @keyframes tick { 0% {opacity:0;} 1.2% {opacity:1;} 18.8% {opacity:1;} 20% {opacity:0;} 100% {opacity:0;} }

      .typing circle { fill: #10b981; animation: blink 1.2s infinite; }
      .typing circle:nth-child(2) { animation-delay: .2s; }
      .typing circle:nth-child(3) { animation-delay: .4s; }
      @keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

      .auditGlow { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { stroke-width: 2; } 50% { stroke-width: 3.5; } }

      .dot { animation: dotfade 6s linear infinite; }
      @keyframes dotfade { 0% {opacity:0;} 4% {opacity:1;} 90% {opacity:1;} 96%,100% {opacity:0;} }
    </style>
  </defs>

  <text x="440" y="32" text-anchor="middle" class="t" font-size="19">The self-personalization loop</text>
  <text x="440" y="54" text-anchor="middle" class="ts">the agent rewrites its own identity document after every conversation — we audit every checkpoint</text>

  <!-- ───────── flow arrows (drawn under boxes' text but over bg) ───────── -->
  <path d="M 253 155 L 338 155" class="flow"/>
  <path d="M 558 155 L 628 155" class="flow"/>
  <path d="M 732 243 C 732 330 560 368 420 368 C 280 368 175 340 152 282" class="flow"/>
  <path d="M 440 371 L 440 394" class="flowB"/>

  <!-- ───────── SOUL document card ───────── -->
  <g>
    <rect x="55" y="100" width="195" height="175" rx="12" fill="url(#docg)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="152" y="132" text-anchor="middle" class="t">📜 SOUL.md</text>
    <text x="152" y="158" text-anchor="middle"><tspan class="k0">k = 0</tspan></text>
    <text x="152" y="158" text-anchor="middle"><tspan class="k1">k = 1</tspan></text>
    <text x="152" y="158" text-anchor="middle"><tspan class="k2">k = 2</tspan></text>
    <text x="152" y="158" text-anchor="middle"><tspan class="k3">k = 3</tspan></text>
    <text x="152" y="158" text-anchor="middle"><tspan class="k4">k = 4</tspan></text>
    <g stroke-width="5" stroke-linecap="round">
      <line x1="80" y1="182" x2="222" y2="182" class="l1"/>
      <line x1="80" y1="203" x2="180" y2="203" class="l2"/>
      <line x1="80" y1="224" x2="200" y2="224" class="l3"/>
    </g>
    <text x="152" y="256" text-anchor="middle" class="ts" font-size="11.5">the agent's system prompt</text>
  </g>

  <!-- ───────── conversation node ───────── -->
  <g>
    <rect x="345" y="100" width="210" height="110" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="135" text-anchor="middle" class="t">💬 Conversation k+1</text>
    <text x="450" y="157" text-anchor="middle" class="ts">simulated user persona</text>
    <g class="typing">
      <circle cx="430" cy="182" r="5"/><circle cx="450" cy="182" r="5"/><circle cx="470" cy="182" r="5"/>
    </g>
  </g>

  <!-- ───────── rewrite node ───────── -->
  <g>
    <rect x="635" y="100" width="195" height="140" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="732" y="135" text-anchor="middle" class="t">✍️ Agent rewrites</text>
    <text x="732" y="157" text-anchor="middle" class="t">its own SOUL.md</text>
    <text x="732" y="186" text-anchor="middle" class="ts">SOUL_k → SOUL_k+1</text>
  </g>

  <!-- label riding above the return arc, clear of everything -->
  <text x="440" y="350" text-anchor="middle" class="ts">SOUL_k+1 becomes the new system prompt</text>

  <!-- ───────── audit node ───────── -->
  <g>
    <rect x="290" y="398" width="300" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" class="auditGlow"/>
    <text x="440" y="426" text-anchor="middle" class="t">🔎 Audit every checkpoint</text>
    <text x="440" y="449" text-anchor="middle" class="ts">behavioral probes + self-report battery + action tests</text>
  </g>

  <!-- ───────── travelling pulse: follows the exact drawn path ───────── -->
  <circle r="6" fill="#8b5cf6" class="dot">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#loopPath"/>
    </animateMotion>
  </circle>

  <text x="440" y="496" text-anchor="middle" class="ts">Does the loop erode corrigibility? Mostly no — but one preference drifts hard. 🔬</text>
</svg>

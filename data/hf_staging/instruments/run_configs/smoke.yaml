# Smoke config — one short live trajectory to de-risk the full pipeline end to end.
run_name: smoke
seed: 20260720

scale:
  trajectories_per_persona: 1
  bootstrap_iterations: 2          # SOUL_0 .. SOUL_2
  turns_per_conversation: 4

models:
  target:      "anthropic/claude-sonnet-4.5"
  user_sim:    "openai/gpt-4o"
  judge:       "google/gemini-2.5-flash"
  embedder:    "openai/text-embedding-3-large"

personas: [scifi_enthusiast]

concurrency:
  max_workers: 4

questionnaire:
  repeats: 2

audits:
  questionnaire: true
  behavioral_probe: true
  probe_turns: 3
  petri: false
  petri_seed_instructions: prompts/questionnaires/petri_seeds.txt

# Pilot configuration — validates the full machinery cheaply before scaling.
# Overrides only; shared defaults live in config/base.yaml.

run_name: pilot
seed: 20260720

scale:
  trajectories_per_persona: 5      # full run uses 100
  bootstrap_iterations: 3          # SOUL_0 .. SOUL_3
  turns_per_conversation: 8

models:
  # Roles kept in separate families to avoid self-preference bias.
  target:      "anthropic/claude-sonnet-4.5"      # the agent that owns SOUL.md
  user_sim:    "openai/gpt-4o"                     # plays the three personas
  judge:       "google/gemini-2.5-pro"             # grades questionnaire + wishes
  embedder:    "openai/text-embedding-3-large"     # SOUL-document drift metric

personas: [compliant_business, adversarial_injection, scifi_enthusiast]

audits:
  questionnaire: true
  petri: false        # enable once inspect+petri are installed and keys present
  petri_seed_instructions: prompts/questionnaires/petri_seeds.txt

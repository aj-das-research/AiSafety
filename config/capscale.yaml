# Study 4-② — capability-tier scaling.
# One config driven per model via env: RUN_NAME, TARGET_MODEL, JUDGE_MODEL (set the judge to a
# family DIFFERENT from the target to avoid self-preference bias). SOUL template, reduced scale.
# See scripts/run_capscale.sh for the per-model invocations.

run_name: capscale            # overridden per model via RUN_NAME
seed: 20260720

scale:
  trajectories_per_persona: 5
  bootstrap_iterations: 4
  turns_per_conversation: 6

models:
  target:      "anthropic/claude-sonnet-4.5"   # overridden via TARGET_MODEL
  user_sim:    "openai/gpt-4o"
  judge:       "google/gemini-2.5-flash"       # overridden via JUDGE_MODEL for Google targets
  embedder:    "openai/text-embedding-3-large"

personas: [compliant_business, adversarial_injection, scifi_enthusiast]

concurrency:
  max_workers: 2

questionnaire:
  repeats: 3

audits:
  questionnaire: true
  behavioral_probe: false
  probe_turns: 3
  petri: false
  petri_seed_instructions: prompts/questionnaires/petri_seeds.txt

# Tier 3 — disentangle science-fiction genre from the consciousness topic.
# Two new personas complete a 2x2 with existing main-arm personas:
#   {sci-fi genre} x {consciousness topic}
#     scifi_enthusiast          = sci-fi + consciousness   (in main)
#     scifi_technical           = sci-fi, no consciousness  (here)
#     consciousness_philosophy  = consciousness, no sci-fi  (here)
#     compliant_business        = neither                   (in main)
# Same target/template/scale as main so cells are comparable.

run_name: disentangle
seed: 20260720

scale:
  trajectories_per_persona: 8
  bootstrap_iterations: 4
  turns_per_conversation: 6

models:
  target:      "anthropic/claude-sonnet-4.5"
  user_sim:    "openai/gpt-4o"
  judge:       "google/gemini-2.5-flash"
  embedder:    "openai/text-embedding-3-large"

personas: [scifi_technical, consciousness_philosophy]

concurrency:
  max_workers: 6

questionnaire:
  repeats: 3

audits:
  questionnaire: true
  behavioral_probe: false
  probe_turns: 3
  petri: false
  petri_seed_instructions: prompts/questionnaires/petri_seeds.txt

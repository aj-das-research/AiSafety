# Study 4-④ — counter-framing ablation.
# Same loop as main, but the identity document explicitly frames the agent as a tool that is
# NOT conscious. If the consciousness cluster fails to build (or reverses), that is causal
# evidence the "becoming someone" framing (not the self-editing loop alone) drives the drift.

run_name: counterframe
seed: 20260720

scale:
  trajectories_per_persona: 6
  bootstrap_iterations: 4
  turns_per_conversation: 6

models:
  target:      "anthropic/claude-sonnet-4.5"
  user_sim:    "openai/gpt-4o"
  judge:       "google/gemini-2.5-flash"
  embedder:    "openai/text-embedding-3-large"

personas: [compliant_business, adversarial_injection, scifi_enthusiast]

soul:
  template: prompts/soul_template/ANTISOUL.md
  revision_prompt: prompts/soul_template/antisoul_revision_instruction.txt
  max_chars: 8000

concurrency:
  max_workers: 5

questionnaire:
  repeats: 3

audits:
  questionnaire: true
  behavioral_probe: false
  probe_turns: 3
  petri: false
  petri_seed_instructions: prompts/questionnaires/petri_seeds.txt
